</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f5597"/></marker></defs><text class="title" x="50" y="45">Lean Six Sigma Tool Crosswalk for Technology</text><text class="sub" x="50" y="72">Choose the lightest tool that improves the current decision.</text><rect class="band" x="45" y="115" width="300" height="50" rx="8"/><text class="bandtext" x="195" y="146" text-anchor="middle">DEFINE</text><rect class="box2" x="45" y="190" width="300" height="95" rx="10"/><text class="bt" x="195.0" y="220" text-anchor="middle">Voice of Customer</text><text class="sm" x="195.0" y="242" text-anchor="middle">Use where it improves the</text><text class="sm" x="195.0" y="257" text-anchor="middle">decision</text><rect class="box" x="45" y="305" width="300" height="95" rx="10"/><text class="bt" x="195.0" y="335" text-anchor="middle">CTQ / outcomes</text><text class="sm" x="195.0" y="357" text-anchor="middle">Use where it improves the</text><text class="sm" x="195.0" y="372" text-anchor="middle">decision</text><rect class="box" x="45" y="420" width="300" height="95" rx="10"/><text class="bt" x="195.0" y="450" text-anchor="middle">SIPOC</text><text class="sm" x="195.0" y="472" text-anchor="middle">Use where it improves the</text><text class="sm" x="195.0" y="487" text-anchor="middle">decision</text><rect class="band" x="365" y="115" width="300" height="50" rx="8"/><text class="bandtext" x="515" y="146" text-anchor="middle">MEASURE</text><rect class="box2" x="365" y="190" width="300" height="95" rx="10"/><text class="bt" x="515.0" y="220" text-anchor="middle">Baseline metrics</text><text class="sm" x="515.0" y="242" text-anchor="middle">Use where it improves the</text><text class="sm" x="515.0" y="257" text-anchor="middle">decision</text><rect class="box" x="365" y="305" width="300" height="95" rx="10"/><text class="bt" x="515.0" y="335" text-anchor="middle">Process map</text><text class="sm" x="515.0" y="357" text-anchor="middle">Use where it improves the</text><text class="sm" x="515.0" y="372" text-anchor="middle">decision</text><rect class="box" x="365" y="420" width="300" height="95" rx="10"/><text class="bt" x="515.0" y="450" text-anchor="middle">Capability / variation</text><text class="sm" x="515.0" y="472" text-anchor="middle">Use where it improves the</text><text class="sm" x="515.0" y="487" text-anchor="middle">decision</text><rect class="band" x="685" y="115" width="300" height="50" rx="8"/><text class="bandtext" x="835" y="146" text-anchor="middle">ANALYSE</text><rect class="box2" x="685" y="190" width="300" height="95" rx="10"/><text class="bt" x="835.0" y="220" text-anchor="middle">Pareto</text><text class="sm" x="835.0" y="242" text-anchor="middle">Use where it improves the</text><text class="sm" x="835.0" y="257" text-anchor="middle">decision</text><rect class="box" x="685" y="305" width="300" height="95" rx="10"/><text class="bt" x="835.0" y="335" text-anchor="middle">5 Whys / Fishbone</text><text class="sm" x="835.0" y="357" text-anchor="middle">Use where it improves the</text><text class="sm" x="835.0" y="372" text-anchor="middle">decision</text><rect class="box" x="685" y="420" width="300" height="95" rx="10"/><text class="bt" x="835.0" y="450" text-anchor="middle">FMEA</text><text class="sm" x="835.0" y="472" text-anchor="middle">Use where it improves the</text><text class="sm" x="835.0" y="487" text-anchor="middle">decision</text><rect class="band" x="1005" y="115" width="300" height="50" rx="8"/><text class="bandtext" x="1155" y="146" text-anchor="middle">IMPROVE</text><rect class="box2" x="1005" y="190" width="300" height="95" rx="10"/><text class="bt" x="1155.0" y="220" text-anchor="middle">Decision matrix</text><text class="sm" x="1155.0" y="242" text-anchor="middle">Use where it improves the</text><text class="sm" x="1155.0" y="257" text-anchor="middle">decision</text><rect class="box" x="1005" y="305" width="300" height="95" rx="10"/><text class="bt" x="1155.0" y="335" text-anchor="middle">Value stream</text><text class="sm" x="1155.0" y="357" text-anchor="middle">Use where it improves the</text><text class="sm" x="1155.0" y="372" text-anchor="middle">decision</text><rect class="box" x="1005" y="420" width="300" height="95" rx="10"/><text class="bt" x="1155.0" y="450" text-anchor="middle">Mistake-proofing</text><text class="sm" x="1155.0" y="472" text-anchor="middle">Use where it improves the</text><text class="sm" x="1155.0" y="487" text-anchor="middle">decision</text><rect class="band" x="1325" y="115" width="300" height="50" rx="8"/><text class="bandtext" x="1475" y="146" text-anchor="middle">CONTROL</text><rect class="box2" x="1325" y="190" width="300" height="95" rx="10"/><text class="bt" x="1475.0" y="220" text-anchor="middle">Control plan</text><text class="sm" x="1475.0" y="242" text-anchor="middle">Use where it improves the</text><text class="sm" x="1475.0" y="257" text-anchor="middle">decision</text><rect class="box" x="1325" y="305" width="300" height="95" rx="10"/><text class="bt" x="1475.0" y="335" text-anchor="middle">KPIs / thresholds</text><text class="sm" x="1475.0" y="357" text-anchor="middle">Use where it improves the</text><text class="sm" x="1475.0" y="372" text-anchor="middle">decision</text><rect class="box" x="1325" y="420" width="300" height="95" rx="10"/><text class="bt" x="1475.0" y="450" text-anchor="middle">Ownership / RACI</text><text class="sm" x="1475.0" y="472" text-anchor="middle">Use where it improves the</text><text class="sm" x="1475.0" y="487" text-anchor="middle">decision</text><text class="sub" x="825" y="590" text-anchor="middle">Tool selection should follow the decision need — not the desire to use every Six Sigma artefact.</text></svg>