<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480">
<title>DMAIC with Agile / Iterative Delivery Overlay</title>
<rect width="1700" height="480" fill="#ffffff"/>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
.title { font-size: 26px; font-weight: 700; fill: #17365d; }
.sub { font-size: 14px; fill: #667085; }
.box { fill: #eef3f9; stroke: #cfd9e8; stroke-width: 1.5; }
.box2 { fill: #ffffff; stroke: #2f5597; stroke-width: 1.8; }
.bt { font-size: 15px; font-weight: 700; fill: #17365d; }
.sm { font-size: 11px; fill: #667085; }
.band { fill: #17365d; }
.bandtext { font-size: 14px; font-weight: 700; fill: #ffffff; }
.arrow { stroke: #2f5597; stroke-width: 2; fill: none; marker-end: url(#arrow); }
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#2f5597"/>
</marker>
</defs>
<text class="title" x="50" y="45">DMAIC + Agile / Iterative Delivery</text><text class="sub" x="50" y="72">DMAIC protects the problem and outcome; iterative delivery provides a learning loop inside Improve.</text><rect class="box2" x="55" y="135" width="170" height="100" rx="10"/><text class="bt" x="140.0" y="165" text-anchor="middle">DEFINE</text><text class="sm" x="140.0" y="186" text-anchor="middle">Problem &amp; outcome</text><path class="arrow" d="M225,185 L253,185"/><rect class="box2" x="257" y="135" width="170" height="100" rx="10"/><text class="bt" x="342.0" y="165" text-anchor="middle">MEASURE</text><text class="sm" x="342.0" y="186" text-anchor="middle">Baseline &amp; telemetry</text><path class="arrow" d="M427,185 L455,185"/><rect class="box2" x="459" y="135" width="180" height="100" rx="10"/><text class="bt" x="549.0" y="165" text-anchor="middle">ANALYSE</text><text class="sm" x="549.0" y="186" text-anchor="middle">Root cause &amp; hypothesis</text><path class="arrow" d="M639,185 L667,185"/><rect class="box2" x="671" y="105" width="720" height="185" rx="12"/><text class="bt" x="1031.0" y="135" text-anchor="middle">IMPROVE — ITERATIVE DELIVERY LOOP</text><rect class="box" x="699" y="165" width="96" height="60" rx="8"/><text class="sm" x="747.0" y="200" text-anchor="middle">Backlog</text><path class="arrow" d="M795,195 L811,195"/><rect class="box" x="815" y="165" width="96" height="60" rx="8"/><text class="sm" x="863.0" y="200" text-anchor="middle">Sprint</text><path class="arrow" d="M911,195 L927,195"/><rect class="box" x="931" y="165" width="96" height="60" rx="8"/><text class="sm" x="979.0" y="200" text-anchor="middle">Test</text><path class="arrow" d="M1027,195 L1043,195"/><rect class="box" x="1047" y="165" width="96" height="60" rx="8"/><text class="sm" x="1095.0" y="200" text-anchor="middle">Release</text><path class="arrow" d="M1143,195 L1159,195"/><rect class="box" x="1163" y="165" width="96" height="60" rx="8"/><text class="sm" x="1211.0" y="200" text-anchor="middle">Measure</text><path class="arrow" d="M1259,195 L1275,195"/><rect class="box" x="1279" y="165" width="96" height="60" rx="8"/><text class="sm" x="1327.0" y="200" text-anchor="middle">Adapt</text><path class="arrow" d="M1346,240 C1371,280 711,280 711,235"/><path class="arrow" d="M1391,197 L1418,197"/><rect class="box2" x="1426" y="135" width="185" height="100" rx="10"/><text class="bt" x="1518.5" y="165" text-anchor="middle">CONTROL</text><text class="sm" x="1518.5" y="186" text-anchor="middle">Operate, monitor, own</text><text class="sm" x="1518.5" y="201" text-anchor="middle">and sustain</text><text class="sub" x="850" y="355" text-anchor="middle">Problem → Evidence → Hypothesis → Increment → Measure → Adapt → Sustain</text><text class="sm" x="850" y="392" text-anchor="middle">New evidence can send the team back to Measure or Analyse.</text></svg>