<text class="title" x="50" y="42">DMAIC Across Technology Management Levels</text><text class="sub" x="50" y="68">The same improvement discipline changes emphasis as the management level changes.</text><rect class="band" x="150" y="105" width="242" height="48" rx="8"/><text class="bandtext" x="271.0" y="135" text-anchor="middle">DEFINE</text><rect class="band" x="400" y="105" width="242" height="48" rx="8"/><text class="bandtext" x="521.0" y="135" text-anchor="middle">MEASURE</text><rect class="band" x="650" y="105" width="242" height="48" rx="8"/><text class="bandtext" x="771.0" y="135" text-anchor="middle">ANALYSE</text><rect class="band" x="900" y="105" width="242" height="48" rx="8"/><text class="bandtext" x="1021.0" y="135" text-anchor="middle">IMPROVE</text><rect class="band" x="1150" y="105" width="242" height="48" rx="8"/><text class="bandtext" x="1271.0" y="135" text-anchor="middle">CONTROL</text><text class="bt" x="25" y="196">Strategy</text><rect class="box" x="150" y="165" width="242" height="70" rx="8"/><text class="sm" x="271.0" y="192" text-anchor="middle">Problem &amp; outcome</text><rect class="box" x="400" y="165" width="242" height="70" rx="8"/><text class="sm" x="521.0" y="192" text-anchor="middle">Capability / maturity</text><text class="sm" x="521.0" y="208" text-anchor="middle">baseline</text><rect class="box" x="650" y="165" width="242" height="70" rx="8"/><text class="sm" x="771.0" y="192" text-anchor="middle">Strategic gaps &amp; causes</text><rect class="box" x="900" y="165" width="242" height="70" rx="8"/><text class="sm" x="1021.0" y="192" text-anchor="middle">Target state &amp; options</text><rect class="box" x="1150" y="165" width="242" height="70" rx="8"/><text class="sm" x="1271.0" y="192" text-anchor="middle">KPIs &amp; strategy review</text><text class="bt" x="25" y="274">Roadmap</text><rect class="box" x="150" y="243" width="242" height="70" rx="8"/><text class="sm" x="271.0" y="270" text-anchor="middle">Scope &amp; planning horizon</text><rect class="box" x="400" y="243" width="242" height="70" rx="8"/><text class="sm" x="521.0" y="270" text-anchor="middle">Current-state estate</text><rect class="box" x="650" y="243" width="242" height="70" rx="8"/><text class="sm" x="771.0" y="270" text-anchor="middle">Dependencies &amp; gaps</text><rect class="box" x="900" y="243" width="242" height="70" rx="8"/><text class="sm" x="1021.0" y="270" text-anchor="middle">Waves &amp; sequencing</text><rect class="box" x="1150" y="243" width="242" height="70" rx="8"/><text class="sm" x="1271.0" y="270" text-anchor="middle">Roadmap governance</text><text class="bt" x="25" y="352">Portfolio</text><rect class="box" x="150" y="321" width="242" height="70" rx="8"/><text class="sm" x="271.0" y="348" text-anchor="middle">Investment themes</text><rect class="box" x="400" y="321" width="242" height="70" rx="8"/><text class="sm" x="521.0" y="348" text-anchor="middle">Spend / capacity /</text><text class="sm" x="521.0" y="364" text-anchor="middle">benefits</text><rect class="box" x="650" y="321" width="242" height="70" rx="8"/><text class="sm" x="771.0" y="348" text-anchor="middle">Duplication &amp; imbalance</text><rect class="box" x="900" y="321" width="242" height="70" rx="8"/><text class="sm" x="1021.0" y="348" text-anchor="middle">Fund / defer / stop</text><rect class="box" x="1150" y="321" width="242" height="70" rx="8"/><text class="sm" x="1271.0" y="348" text-anchor="middle">Portfolio review</text><text class="bt" x="25" y="430">Program</text><rect class="box" x="150" y="399" width="242" height="70" rx="8"/><text class="sm" x="271.0" y="426" text-anchor="middle">Outcome &amp; benefit</text><text class="sm" x="271.0" y="442" text-anchor="middle">hypothesis</text><rect class="box" x="400" y="399" width="242" height="70" rx="8"/><text class="sm" x="521.0" y="426" text-anchor="middle">Cross-project baseline</text><rect class="box" x="650" y="399" width="242" height="70" rx="8"/><text class="sm" x="771.0" y="426" text