<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="440" viewBox="0 0 1700 440">
<title>Portfolio Prioritisation</title><rect width="1700" height="440" fill="#ffffff"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-size:26px;font-weight:700;fill:#17365d}.sub{font-size:14px;fill:#667085}
.box{fill:#eef3f9;stroke:#cfd9e8;stroke-width:1.5}.box2{fill:#ffffff;stroke:#2f5597;stroke-width:1.8}.bt{font-size:15px;font-weight:700;fill:#17365d}
.sm{font-size:11px;fill:#667085}.band{fill:#17365d}.bandtext{font-size:14px;font-weight:700;fill:#ffffff}.arrow{stroke:#2f5597;stroke-width:2;fill:none;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f5597"/></marker></defs><text class="title" x="50" y="45">Portfolio Prioritisation Through an Evidence Lens</text><text class="sub" x="50" y="72">Make demand, trade-offs and evidence confidence visible before funding decisions.</text><rect class="box2" x="35" y="140" width="190" height="105" rx="10"/><text class="bt" x="130.0" y="170" text-anchor="middle">Demand</text><text class="sm" x="130.0" y="192" text-anchor="middle">Strategy · risk ·</text><text class="sm" x="130.0" y="207" text-anchor="middle">regulatory · customer</text><path class="arrow" d="M225,192 L240,192"/><rect class="box" x="245" y="140" width="190" height="105" rx="10"/><text class="bt" x="340.0" y="170" text-anchor="middle">Define</text><text class="sm" x="340.0" y="192" text-anchor="middle">Outcome &amp; criteria</text><path class="arrow" d="M435,192 L450,192"/><rect class="box" x="455" y="140" width="190" height="105" rx="10"/><text class="bt" x="550.0" y="170" text-anchor="middle">Measure</text><text class="sm" x="550.0" y="192" text-anchor="middle">Spend · capacity ·</text><text class="sm" x="550.0" y="207" text-anchor="middle">benefits · WIP</text><path class="arrow" d="M645,192 L660,192"/><rect class="box" x="665" y="140" width="190" height="105" rx="10"/><text class="bt" x="760.0" y="170" text-anchor="middle">Analyse</text><text class="sm" x="760.0" y="192" text-anchor="middle">Value · dependency ·</text><text class="sm" x="760.0" y="207" text-anchor="middle">confidence</text><path class="arrow" d="M855,192 L870,192"/><rect class="box2" x="875" y="140" width="190" height="105" rx="10"/><text class="bt" x="970.0" y="170" text-anchor="middle">Prioritise</text><text class="sm" x="970.0" y="192" text-anchor="middle">Fit · value · risk ·</text><text class="sm" x="970.0" y="207" text-anchor="middle">effort</text><path class="arrow" d="M1065,192 L1080,192"/><rect class="box" x="1085" y="140" width="190" height="105" rx="10"/><text class="bt" x="1180.0" y="170" text-anchor="middle">Decide</text><text class="sm" x="1180.0" y="192" text-anchor="middle">Fund · defer · stop ·</text><text class="sm" x="1180.0" y="207" text-anchor="middle">sequence</text><path class="arrow" d="M1275,192 L1290,192"/><rect class="box" x="1295" y="140" width="190" height="105" rx="10"/><text class="bt" x="1390.0" y="170" text-anchor="middle">Deliver</text><text class="sm" x="1390.0" y="192" text-anchor="middle">Programs / projects /</text><text class="sm" x="1390.0" y="207" text-anchor="middle">product</text><path class="arrow" d="M1485,192 L1500,192"/><rect class="box2" x="1505" y="140" width="190" height="105" rx="10"/><text class="bt" x="1600.0" y="170" text-anchor="middle">Rebalance</text><text class="sm" x="1600.0" y="192" text-anchor="middle">Measure benefits and</text><text class="sm" x="1600.0" y="207" text-anchor="middle">revisit</text><rect class="band" x="35" y="305" width="1625" height="55" rx="10"/><text class="bandtext" x="848" y="338" text-anchor="middle">Approve → Deliver → Measure → Reassess → Continue / Adapt / Stop</text></svg>