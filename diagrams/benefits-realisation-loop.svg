<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="420" viewBox="0 0 1650 420">
<title>Benefits Realisation Loop</title><rect width="1650" height="420" fill="#ffffff"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-size:26px;font-weight:700;fill:#17365d}.sub{font-size:14px;fill:#667085}
.box{fill:#eef3f9;stroke:#cfd9e8;stroke-width:1.5}.box2{fill:#ffffff;stroke:#2f5597;stroke-width:1.8}.bt{font-size:15px;font-weight:700;fill:#17365d}
.sm{font-size:11px;fill:#667085}.band{fill:#17365d}.bandtext{font-size:14px;font-weight:700;fill:#ffffff}.arrow{stroke:#2f5597;stroke-width:2;fill:none;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f5597"/></marker></defs><text class="title" x="50" y="45">Benefits Realisation &amp; Control Loop</text><text class="sub" x="50" y="72">Benefits evidence should feed the next strategy and portfolio cycle.</text><rect class="box2" x="45" y="145" width="230" height="100" rx="10"/><text class="bt" x="160.0" y="175" text-anchor="middle">Deliver</text><text class="sm" x="160.0" y="197" text-anchor="middle">Output complete</text><path class="arrow" d="M275,195 L295,195"/><rect class="box" x="300" y="145" width="230" height="100" rx="10"/><text class="bt" x="415.0" y="175" text-anchor="middle">Operate</text><text class="sm" x="415.0" y="197" text-anchor="middle">Capability used</text><path class="arrow" d="M530,195 L550,195"/><rect class="box" x="555" y="145" width="230" height="100" rx="10"/><text class="bt" x="670.0" y="175" text-anchor="middle">Measure</text><text class="sm" x="670.0" y="197" text-anchor="middle">Outcome data</text><path class="arrow" d="M785,195 L805,195"/><rect class="box2" x="810" y="145" width="230" height="100" rx="10"/><text class="bt" x="925.0" y="175" text-anchor="middle">Compare</text><text class="sm" x="925.0" y="197" text-anchor="middle">Against baseline</text><path class="arrow" d="M1040,195 L1060,195"/><rect class="box" x="1065" y="145" width="230" height="100" rx="10"/><text class="bt" x="1180.0" y="175" text-anchor="middle">Learn / Adjust</text><text class="sm" x="1180.0" y="197" text-anchor="middle">Adoption, design or</text><text class="sm" x="1180.0" y="212" text-anchor="middle">assumptions</text><path class="arrow" d="M1295,195 L1315,195"/><rect class="box2" x="1320" y="145" width="250" height="100" rx="10"/><text class="bt" x="1445.0" y="175" text-anchor="middle">Feed Strategy</text><text class="sm" x="1445.0" y="197" text-anchor="middle">Scale, change, stop or</text><text class="sm" x="1445.0" y="212" text-anchor="middle">reprioritise</text><text class="sub" x="825" y="350" text-anchor="middle">The framework is a managed learning loop, not a one-way delivery pipeline.</text></svg>