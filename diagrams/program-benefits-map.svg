<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="520" viewBox="0 0 1650 520">
<title>Program Benefits Mapping</title><rect width="1650" height="520" fill="#ffffff"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-size:26px;font-weight:700;fill:#17365d}.sub{font-size:14px;fill:#667085}
.box{fill:#eef3f9;stroke:#cfd9e8;stroke-width:1.5}.box2{fill:#ffffff;stroke:#2f5597;stroke-width:1.8}.bt{font-size:15px;font-weight:700;fill:#17365d}
.sm{font-size:11px;fill:#667085}.band{fill:#17365d}.bandtext{font-size:14px;font-weight:700;fill:#ffffff}.arrow{stroke:#2f5597;stroke-width:2;fill:none;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f5597"/></marker></defs><text class="title" x="50" y="45">Program Benefits Mapping</text><text class="sub" x="50" y="72">Multiple project outputs should converge on measurable program outcomes.</text><rect class="box" x="50" y="120" width="210" height="58" rx="10"/><text class="bt" x="155.0" y="150" text-anchor="middle">Project A</text><text class="sm" x="155.0" y="172" text-anchor="middle">CRM workflow</text><path class="arrow" d="M260,149 L420,250"/><rect class="box" x="50" y="190" width="210" height="58" rx="10"/><text class="bt" x="155.0" y="220" text-anchor="middle">Project B</text><text class="sm" x="155.0" y="242" text-anchor="middle">Identity automation</text><path class="arrow" d="M260,219 L420,250"/><rect class="box" x="50" y="260" width="210" height="58" rx="10"/><text class="bt" x="155.0" y="290" text-anchor="middle">Project C</text><text class="sm" x="155.0" y="312" text-anchor="middle">Integration</text><path class="arrow" d="M260,289 L420,250"/><rect class="box" x="50" y="330" width="210" height="58" rx="10"/><text class="bt" x="155.0" y="360" text-anchor="middle">Project D</text><text class="sm" x="155.0" y="382" text-anchor="middle">Data quality</text><path class="arrow" d="M260,359 L420,250"/><rect class="box" x="50" y="400" width="210" height="58" rx="10"/><text class="bt" x="155.0" y="430" text-anchor="middle">Project E</text><text class="sm" x="155.0" y="452" text-anchor="middle">Training / adoption</text><path class="arrow" d="M260,429 L420,250"/><rect class="box2" x="420" y="195" width="260" height="115" rx="10"/><text class="bt" x="550.0" y="225" text-anchor="middle">Capability Change</text><text class="sm" x="550.0" y="247" text-anchor="middle">Connected, automated onboarding</text><text class="sm" x="550.0" y="262" text-anchor="middle">capability</text><path class="arrow" d="M680,252 L750,252"/><rect class="box" x="750" y="195" width="260" height="115" rx="10"/><text class="bt" x="880.0" y="225" text-anchor="middle">Process / Behaviour</text><text class="sm" x="880.0" y="247" text-anchor="middle">Fewer hand-offs, less rework,</text><text class="sm" x="880.0" y="262" text-anchor="middle">higher adoption</text><path class="arrow" d="M1010,252 L1080,252"/><rect class="box2" x="1080" y="195" width="240" height="115" rx="10"/><text class="bt" x="1200.0" y="225" text-anchor="middle">Outcome</text><text class="sm" x="1200.0" y="247" text-anchor="middle">Faster onboarding with fewer</text><text class="sm" x="1200.0" y="262" text-anchor="middle">exceptions</text><path class="arrow" d="M1320,252 L1375,252"/><rect class="box" x="1375" y="195" width="220" height="115" rx="10"/><text class="bt" x="1485.0" y="225" text-anchor="middle">Benefit</text><text class="sm" x="1485.0" y="247" text-anchor="middle">Lower effort + better</text><text class="sm" x="1485.0" y="262" text-anchor="middle">customer experience</text><text class="sub" x="825" y="455" text-anchor="middle">Project status measures delivery health. Program measures should also track whether the combined change creates the intended outcome.</text></svg>